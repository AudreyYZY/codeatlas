[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.3.0"
description = "A local-first, language-aware code knowledge base — like a personal Sourcegraph."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Audrey Yang" }
]
keywords = [
    "code-analysis",
    "typescript",
    "python",
    "call-graph",
    "dependency-graph",
    "mermaid",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "click>=8.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "httpx>=0.27",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[project.urls]
Homepage = "https://github.com/AudreyYZY/codeatlas"
Repository = "https://github.com/AudreyYZY/codeatlas"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeatlas*"]

[tool.setuptools.package-data]
"codeatlas.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
